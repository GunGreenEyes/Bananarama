name: test
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Tray tests
        shell: pwsh
        run: ./tray/build.ps1 -Test
