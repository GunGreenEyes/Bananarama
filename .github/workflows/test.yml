name: test
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Tray tests
        shell: pwsh
        run: ./tray/build.ps1 -Test
